name: harborstats

services:
  web:
    container_name: harborstats-web
    build:
      context: ../web
      target: runner
    environment:
      NODE_ENV: production
      DATABASE_PATH: /data/harborstats.db
      # The app refuses to start on a missing or empty database in production,
      # so a wrong volume never serves an empty site. Set this to 1 only for the
      # first start of a fresh install (see the deploy README).
      DATABASE_ALLOW_CREATE: ${DATABASE_ALLOW_CREATE:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET}
      ADMIN_SESSION_VERSION: ${ADMIN_SESSION_VERSION:-1}
    volumes:
      - harborstats_data:/data
    ports:
      - "23413:3000"
    restart: always

volumes:
  harborstats_data:
    # Fixed name, so the volume holding the database never depends on the
    # compose project name.
    name: harborstats_data
