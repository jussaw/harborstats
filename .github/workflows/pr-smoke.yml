name: PR Smoke

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'devops/**'
      - 'web/**'

jobs:
  fast-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # HarborStats supports Node >=22.13 <27 (see web/package.json engines).
        # CI exercises both ends of the range: Node 22 (Dockerfile baseline)
        # and Node 26 (latest supported). The component test suite uses
        # --no-webstorage on Node >=25 to work around vitest 4's jsdom
        # localStorage issue (fixed in vitest 5).
        node-version: [22, 26]

    defaults:
      run:
        working-directory: web

    env:
      CI: true
      TZ: UTC

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (Node 22 only)
        if: matrix.node-version == 22
        run: pnpm lint

      - name: Build (Node 22 only)
        if: matrix.node-version == 22
        run: pnpm build

      - name: Fast tests
        run: pnpm test:fast

  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: harborstats
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CI: true
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/harborstats_test
      ADMIN_PASSWORD: harborstats-test-password
      ADMIN_SESSION_SECRET: harborstats-test-session-secret-please-change
      TEST_BASE_URL: http://127.0.0.1:3100
      TZ: UTC

    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v4
        with:
          # Full suite runs on Node 22 (the Dockerfile/production baseline).
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: DevOps shell tests
        working-directory: .
        run: bash devops/tests/backup-restore.test.sh

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build
        run: pnpm build

      - name: Integration tests
        run: pnpm test:integration

      - name: End-to-end tests (Playwright, isolated test server)
        run: pnpm exec playwright test
