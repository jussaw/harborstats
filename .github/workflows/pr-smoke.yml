name: PR Smoke

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'devops/**'
      - 'web/**'
  # Pushes to main run the same checks, then publish the deployable image.
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'devops/**'
      - 'web/**'

# Superseded runs on a pull request are cancelled. Runs on main queue instead,
# so two quick merges publish :latest in merge order.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  fast-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # HarborStats supports Node >=22.13 <27 (see web/package.json engines).
        # CI exercises both ends of the range: Node 22 (Dockerfile baseline)
        # and Node 26 (latest supported). The component test suite uses
        # --no-webstorage on Node >=25 to work around vitest 4's jsdom
        # localStorage issue (fixed in vitest 5).
        node-version: [22, 26]

    defaults:
      run:
        working-directory: web

    env:
      CI: true
      TZ: UTC

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (Node 22 only)
        if: matrix.node-version == 22
        run: pnpm lint

      - name: Build (Node 22 only)
        if: matrix.node-version == 22
        run: pnpm build

      - name: Fast tests
        run: pnpm test:fast

  full-suite:
    # Pinned: ubuntu-latest is now 26.04, where Playwright 1.59 can't install
    # Chromium's system dependencies. Unpin once Playwright supports it.
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    # Tests run against a temporary SQLite file that the prepare step creates
    # (see tests/helpers/test-env.ts); no database service is needed.
    env:
      CI: true
      ADMIN_PASSWORD: harborstats-test-password
      ADMIN_SESSION_SECRET: harborstats-test-session-secret-please-change
      TEST_BASE_URL: http://127.0.0.1:3100
      TZ: UTC

    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v4
        with:
          # Full suite runs on Node 22 (the Dockerfile/production baseline).
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: DevOps shell tests
        working-directory: .
        run: bash devops/tests/backup-restore.test.sh

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build
        run: pnpm build

      - name: Integration tests
        run: pnpm test:integration

      - name: End-to-end tests (Playwright, isolated test server)
        run: pnpm test:e2e

  # Publishes ghcr.io/jussaw/harborstats. Gated on both smoke jobs because
  # production follows :latest, so an image published from a red build would
  # ship straight to production (and run its migrations there). Lives in this
  # workflow so `needs:` can express that gate.
  #
  # Built on two native runners rather than one with QEMU: emulating an arm64
  # Next.js build would take tens of minutes. Standard runners, including
  # ubuntu-24.04-arm, are free on public repositories.
  publish-image:
    name: publish-image (${{ matrix.platform }})
    needs: [fast-tests, full-suite]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Normalize platform for artifact name
        run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"
        env:
          PLATFORM: ${{ matrix.platform }}

      # Labels only here; tags belong to the manifest, which publish-manifest
      # assembles. org.opencontainers.image.source links the package to this
      # repo.
      - name: Derive image labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./web
          file: ./web/Dockerfile
          target: runner
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Joins the two per-architecture digests into one multi-arch manifest, so
  # ghcr.io/jussaw/harborstats:latest serves the right image to arm64 and x86
  # hosts alike. Also tags it with the full commit sha, so a rollback can pin an
  # exact build.
  publish-manifest:
    name: publish-manifest
    needs: publish-image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest list
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ github.repository }}@sha256:%s ' *)

      - name: Inspect published manifest
        run: docker buildx imagetools inspect ghcr.io/${{ github.repository }}:latest
